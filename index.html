<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fourth Axis Capital</title>
  <meta name="description" content="Fourth Axis Capital" />
  <meta name="theme-color" content="#f7f5f0" />

  <style>
    :root{
      --bg:#f7f5f0;
      --text:#22252a;
      --muted:#4e5258;
      --line:rgba(34,37,42,.10);
      --line-strong:rgba(34,37,42,.18);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
    }

    body{
      font-family:"Avenir Next", Avenir, "Century Gothic", Futura, Aptos, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    .page{
      min-height:100vh;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:42px 26px 28px;
    }

    /* Larger diamond field; intentionally allowed to run off-page */
    .hologram{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }

    .hologram::before,
    .hologram::after{
      content:"";
      position:absolute;
      left:50%;
      top:48%;
      transform:translate(-50%,-50%) rotate(45deg);
      border:1px solid var(--line);
    }

    .hologram::before{
      width:min(110vw, 1280px);
      height:min(110vw, 1280px);
    }

    .hologram::after{
      width:min(76vw, 860px);
      height:min(76vw, 860px);
      border-color:var(--line-strong);
    }

    .logo-wrap,
    .content,
    .contact{
      position:relative;
      z-index:2;
    }

    .logo-wrap{
      width:min(70vw, 640px);
      margin-top:-4px;
    }

    .logo{
      display:block;
      width:100%;
      height:auto;
    }

    .content{
      margin-top:-54px;
      text-align:center;
    }

    .tagline{
      margin:0;
      color:var(--text);
      font-size:clamp(20px, 2vw, 28px);
      line-height:1.35;
      font-weight:400;
      letter-spacing:.015em;
    }

    .coming-soon{
      margin:23px 0 0;
      color:var(--text);
      font-size:clamp(15px, 1.45vw, 20px);
      line-height:1;
      font-weight:400;
      letter-spacing:.34em;
      text-transform:uppercase;
    }

    /* Bring inquiries up into the lower half of the diamond */
    .contact{
      margin-top:clamp(120px, 16vh, 185px);
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
      font-weight:400;
      letter-spacing:.03em;
      margin-bottom:18px;
    }

    .contact-label{
      margin-bottom:2px;
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:11px;
    }

    .contact a{
      color:inherit;
      text-decoration:none;
    }

    .contact a:hover{
      text-decoration:underline;
      text-underline-offset:3px;
    }

    @media (max-width:700px){
      .page{
        padding:26px 18px 20px;
      }

      .logo-wrap{
        width:min(94vw, 550px);
      }

      .content{
        margin-top:-28px;
      }

      .coming-soon{
        margin-top:19px;
      }

      .contact{
        margin-top:clamp(84px, 14vh, 120px);
        margin-bottom:10px;
      }

      .hologram::before{
        width:136vw;
        height:136vw;
      }

      .hologram::after{
        width:92vw;
        height:92vw;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="hologram" aria-hidden="true"></div>

    <div class="logo-wrap">
      <img
        class="logo"
        src="fourth-axis-logo-light-bg.png"
        alt="Fourth Axis Capital"
      />
    </div>

    <section class="content">
      <p class="tagline">Investing in Intelligent Infrastructure.</p>
      <p class="coming-soon">Coming Soon</p>
    </section>

    <section class="contact">
      <div class="contact-label">Inquiries</div>
      <a href="mailto:info@fourthaxis.capital">info@fourthaxis.capital</a>
    </section>
  </main>
</body>
</html>

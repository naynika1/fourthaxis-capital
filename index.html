<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fourth Axis Capital</title>
  <meta name="description" content="Fourth Axis Capital" />
  <meta name="theme-color" content="#ffffff" />

  <style>
    :root{
      --bg:#ffffff;
      --text:#111111;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
    }

    body{
      font-family:Aptos, "Aptos Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:46px 28px 30px;
    }

    .logo-wrap{
      width:min(72vw, 670px);
      margin-top:0;
    }

    .logo{
      display:block;
      width:100%;
      height:auto;
    }

    .content{
      margin-top:-58px;
      text-align:center;
      color:var(--text);
    }

    .tagline{
      margin:0;
      font-size:clamp(22px, 2.05vw, 29px);
      line-height:1.35;
      font-weight:400;
      letter-spacing:-0.012em;
    }

    .coming-soon{
      margin:24px 0 0;
      font-size:clamp(17px, 1.55vw, 21px);
      line-height:1;
      font-weight:400;
      letter-spacing:.32em;
      text-transform:uppercase;
    }

    .spacer{
      flex:1;
      min-height:130px;
    }

    .contact{
      text-align:center;
      color:var(--text);
      font-size:clamp(18px, 1.65vw, 23px);
      line-height:1.5;
      font-weight:400;
      margin-bottom:0;
    }

    .contact-label{
      margin-bottom:0;
    }

    .contact a{
      color:inherit;
      text-decoration:none;
    }

    .contact a:hover{
      text-decoration:underline;
      text-underline-offset:4px;
    }

    @media (max-width:700px){
      .page{
        padding:28px 18px 24px;
      }

      .logo-wrap{
        width:min(94vw, 560px);
      }

      .content{
        margin-top:-30px;
      }

      .coming-soon{
        margin-top:20px;
      }

      .spacer{
        min-height:90px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
      <img
        class="logo"
        src="fourth-axis-logo-light-bg.png"
        alt="Fourth Axis Capital"
      />
    </div>

    <section class="content">
      <p class="tagline">Investing in Intelligent Infrastructure.</p>
      <p class="coming-soon">Coming Soon</p>
    </section>

    <div class="spacer"></div>

    <section class="contact">
      <div class="contact-label">Inquiries:</div>
      <a href="mailto:info@fourthaxis.capital">info@fourthaxis.capital</a>
    </section>
  </main>
</body>
</html>

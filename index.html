<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fourth Axis Capital</title>
  <meta name="description" content="Fourth Axis Capital" />
  <meta name="theme-color" content="#111317" />
  <style>
    :root{
      --bg:#111317;
      --text:#f3efe8;
      --muted:#b1ada3;
      --line:rgba(243,239,232,.16);
      --panel:rgba(255,255,255,.02);
      --border:rgba(243,239,232,.12);
    }

    @media (prefers-color-scheme: light){
      :root{
        --bg:#f7f4ee;
        --text:#181a1d;
        --muted:#676159;
        --line:rgba(24,26,29,.10);
        --panel:rgba(0,0,0,.015);
        --border:rgba(24,26,29,.10);
      }
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Aptos", "Aptos Display", "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .page{
      min-height:100svh;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .grid{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(var(--line), var(--line)) 50% 0/1px 100% no-repeat,
        linear-gradient(90deg, transparent 0, var(--line) 20%, var(--line) 80%, transparent 100%) 50% 52%/70vw 1px no-repeat;
      opacity:.9;
    }

    .grid::before,
    .grid::after{
      content:"";
      position:absolute;
      left:50%;
      top:52%;
      width:min(68vw, 900px);
      height:min(68vw, 900px);
      border:1px solid var(--line);
      transform:translate(-50%,-50%) rotate(45deg);
    }

    .grid::after{
      width:min(48vw, 620px);
      height:min(48vw, 620px);
      opacity:.7;
    }

    header, footer{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:26px 34px;
      font-size:12px;
      letter-spacing:.17em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .brand{
      color:var(--text);
      font-weight:500;
      letter-spacing:.16em;
    }

    main{
      position:relative;
      z-index:2;
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 24px 64px;
    }

    .hero{
      width:min(100%, 1100px);
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:12px;
    }

    .logo-wrap{
      width:min(78vw, 620px);
      padding:12px;
      border-radius:22px;
    }

    .logo{
      width:100%;
      height:auto;
      display:block;
      margin:0 auto;
    }

    .logo-lightbg{ display:none; }
    .logo-darkbg{ display:block; }

    @media (prefers-color-scheme: light){
      .logo-lightbg{ display:block; }
      .logo-darkbg{ display:none; }
    }

    .rule{
      width:64px;
      height:1px;
      background:var(--text);
      opacity:.45;
    }

    .sub{
      max-width:620px;
      margin:0;
      font-size:clamp(15px, 1.45vw, 18px);
      line-height:1.5;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:400;
    }

    .card{
      margin-top:6px;
      border:1px solid var(--border);
      background:var(--panel);
      padding:12px 16px;
      border-radius:999px;
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    a{ color:inherit; text-decoration:none; }
    a:hover{ opacity:.82; }

    @media (max-width:740px){
      header, footer{ padding:20px 20px; font-size:11px; gap:14px; }
      main{ padding:36px 20px 48px; }
      .logo-wrap{ width:min(92vw, 520px); }
      .sub{ max-width:92vw; }
      footer{ flex-direction:column; }
      .grid::before{ width:96vw; height:96vw; }
      .grid::after{ width:72vw; height:72vw; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="grid" aria-hidden="true"></div>

    <header>
      <div class="brand">Fourth Axis Capital</div>
      <div>fourthaxis.capital</div>
    </header>

    <main>
      <section class="hero" aria-label="Fourth Axis Capital">
        <div class="logo-wrap">
          <img class="logo logo-darkbg" src="fourth-axis-logo-dark-bg.png" alt="Fourth Axis Capital logo" />
          <img class="logo logo-lightbg" src="fourth-axis-logo-light-bg.png" alt="Fourth Axis Capital logo" />
        </div>
        <p class="sub">Investing in Intelligent Infrastructure</p>
      </section>
    </main>

    <footer>
      <div>Fourth Axis Capital</div>
      <div>Inquiries: <a href="mailto:info@fourthaxis.capital">info@fourthaxis.capital</a></div>
    </footer>
  </div>
</body>
</html>

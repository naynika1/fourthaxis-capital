<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fourth Axis Capital</title>
  <meta name="description" content="Fourth Axis Capital" />
  <meta name="theme-color" content="#f7f5f0" />

  <style>
    :root{
      --bg:#f7f5f0;
      --text:#202226;
      --muted:#4d5054;
      --line:rgba(32,34,38,.10);
      --line-strong:rgba(32,34,38,.18);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
    }

    body{
      font-family:"Avenir Next", Avenir, "Century Gothic", Futura, Aptos, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    .page{
      min-height:100vh;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:44px 26px 26px;
    }

    /* Subtle geometric / holographic field */
    .hologram{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }

    .hologram::before,
    .hologram::after{
      content:"";
      position:absolute;
      left:50%;
      top:46%;
      transform:translate(-50%,-50%) rotate(45deg);
      border:1px solid var(--line);
    }

    .hologram::before{
      width:min(78vw, 920px);
      height:min(78vw, 920px);
    }

    .hologram::after{
      width:min(54vw, 640px);
      height:min(54vw, 640px);
      border-color:var(--line-strong);
    }

    .axis-v,
    .axis-h,
    .axis-d{
      position:absolute;
      left:50%;
      top:46%;
      transform-origin:center;
      pointer-events:none;
    }

    .axis-v{
      width:1px;
      height:78vh;
      background:linear-gradient(to bottom, transparent, var(--line), var(--line-strong), var(--line), transparent);
      transform:translate(-50%,-50%);
    }

    .axis-h{
      width:min(78vw, 920px);
      height:1px;
      background:linear-gradient(to right, transparent, var(--line), var(--line-strong), var(--line), transparent);
      transform:translate(-50%,-50%);
    }

    .axis-d{
      width:min(65vw, 760px);
      height:1px;
      background:linear-gradient(to right, transparent, var(--line), var(--line-strong), var(--line), transparent);
      transform:translate(-50%,-50%) rotate(-18deg);
    }

    .logo-wrap,
    .content,
    .contact{
      position:relative;
      z-index:2;
    }

    .logo-wrap{
      width:min(70vw, 640px);
      margin-top:-4px;
    }

    .logo{
      display:block;
      width:100%;
      height:auto;
    }

    .content{
      margin-top:-54px;
      text-align:center;
    }

    .tagline{
      margin:0;
      color:var(--text);
      font-size:clamp(20px, 2vw, 28px);
      line-height:1.35;
      font-weight:400;
      letter-spacing:.015em;
    }

    .coming-soon{
      margin:23px 0 0;
      color:var(--text);
      font-size:clamp(15px, 1.45vw, 20px);
      line-height:1;
      font-weight:400;
      letter-spacing:.34em;
      text-transform:uppercase;
    }

    .spacer{
      flex:1;
      min-height:150px;
    }

    .contact{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
      font-weight:400;
      letter-spacing:.03em;
      margin-bottom:4px;
    }

    .contact-label{
      margin-bottom:2px;
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:11px;
    }

    .contact a{
      color:inherit;
      text-decoration:none;
    }

    .contact a:hover{
      text-decoration:underline;
      text-underline-offset:3px;
    }

    @media (max-width:700px){
      .page{
        padding:28px 18px 22px;
      }

      .logo-wrap{
        width:min(94vw, 550px);
      }

      .content{
        margin-top:-28px;
      }

      .coming-soon{
        margin-top:19px;
      }

      .spacer{
        min-height:110px;
      }

      .hologram::before{
        width:112vw;
        height:112vw;
      }

      .hologram::after{
        width:78vw;
        height:78vw;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="hologram" aria-hidden="true">
      <div class="axis-v"></div>
      <div class="axis-h"></div>
      <div class="axis-d"></div>
    </div>

    <div class="logo-wrap">
      <img
        class="logo"
        src="fourth-axis-logo-light-bg.png"
        alt="Fourth Axis Capital"
      />
    </div>

    <section class="content">
      <p class="tagline">Investing in Intelligent Infrastructure.</p>
      <p class="coming-soon">Coming Soon</p>
    </section>

    <div class="spacer"></div>

    <section class="contact">
      <div class="contact-label">Inquiries</div>
      <a href="mailto:info@fourthaxis.capital">info@fourthaxis.capital</a>
    </section>
  </main>
</body>
</html>
